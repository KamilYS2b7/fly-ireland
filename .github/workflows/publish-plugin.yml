name: Publish Fly Ireland to Windy

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    publish-plugin:
        runs-on: ubuntu-latest
        env:
            WINDY_API_KEY: '${{ secrets.WINDY_API_KEY }}'
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false
            - name: Build
              run: |
                  npm ci
                  npm test
                  npm run build
            - name: Publish Plugin
              run: |
                  if [ -z "$WINDY_API_KEY" ]; then
                    echo "Secret WINDY_API_KEY is not configured" >&2
                    exit 1
                  fi
                  cd dist
                  echo "Creating plugin archive..."
                  echo "{\"repositoryName\": \"${{ github.repository }}\", \"commitSha\": \"${{ github.sha }}\", \"repositoryOwner\": \"${{ github.repository_owner }}\"}" > /tmp/plugin-info.json
                  mv plugin.json /tmp
                  # Screenshots are optional metadata, not runtime site photos.
                  # Keep the source screenshot and debug maps in GitHub, not the upload.
                  jq -s '.[0] * .[1] | del(.screenshot)' /tmp/plugin.json /tmp/plugin-info.json > plugin.json
                  tar --exclude='./*.map' --exclude='./screenshot.*' -cf ../plugin.tar .
                  echo "Upload archive size: $(wc -c < ../plugin.tar) bytes"
                  echo "Publishing plugin..."
                  curl -s --fail-with-body -XPOST 'https://node.windy.com/plugins/v1.0/upload' -H "x-windy-api-key: ${WINDY_API_KEY}" -F "plugin_archive=@../plugin.tar"
